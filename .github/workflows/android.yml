name: Android APK

# Svaki push na main pravi potpisan release APK i objavljuje ga kao GitHub Release.
# Push na druge grane i pull request-ovi samo proveravaju da build prolazi
# (APK je dostupan kao artifact, bez Release-a).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      KOSAT_VERSION_CODE: ${{ github.run_number }}
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Keš node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Gradle (sa keširanjem)
        uses: gradle/actions/setup-gradle@v4

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Više memorije za Gradle
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' android/gradle.properties
          grep '^org.gradle.jvmargs' android/gradle.properties

      - name: Release keystore iz GitHub secrets-a
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KOSAT_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Keystore dekodiran ($(wc -c < "$RUNNER_TEMP/release.keystore") bajtova)."
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::Nedostaje secret KEYSTORE_BASE64. Dodaj ga u Settings > Secrets and variables > Actions (vidi README)."
            exit 1
          else
            echo "::warning::KEYSTORE_BASE64 nije postavljen – ovaj probni build je potpisan debug ključem."
          fi

      - name: Build APK (arm64-v8a)
        working-directory: android
        env:
          KOSAT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KOSAT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KOSAT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace

      - name: Pripremi APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          mkdir -p dist
          cp "$APK" "dist/kosat-music-games-$VERSION_NAME.apk"

      - name: Otisak potpisa (SHA1 mora da se poklapa sa Spotify Dashboard-om)
        continue-on-error: true
        run: |
          APK="dist/kosat-music-games-$VERSION_NAME.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" 2>&1 | grep -v "^WARNING" || true

      - name: APK kao artifact
        uses: actions/upload-artifact@v4
        with:
          name: kosat-music-games-${{ env.VERSION_NAME }}
          path: dist/*.apk
          retention-days: 14

      - name: GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Kosat Music Games ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            APK za Android (arm64-v8a), build #${{ github.run_number }}.
            Otvori ovu stranu na telefonu, tapni na `.apk` fajl ispod (Assets) i instaliraj ga.
            Commit: ${{ github.sha }}
