plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kosat.spotifyremote'
version = '1.0.0'

// Spotify App Remote SDK nije na Maven Central-u, pa ga držimo u lokalnom
// Maven repou unutar modula. Isti repo config plugin (app.plugin.js) dodaje
// i u root build.gradle, da bi ga i :app projekat video.
repositories {
  maven { url = uri("${projectDir}/maven") }
}

android {
  namespace "expo.modules.spotifyremote"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  implementation 'com.spotify.android:spotify-app-remote:0.8.0'
  implementation 'com.google.code.gson:gson:2.11.0'
}
